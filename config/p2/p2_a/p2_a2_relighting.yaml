experiment_id: p2_a2_relighting
project_root: E:/projects/face2
manifest_path: data/processed/P2_DetailPreserving_Relighting500_v2/manifests/p2_training_manifest.csv
output_root: experiments/500Data/P2_Physics_Relighting_v2/rgb_benchmark
smoke_output_root: experiments/500Data/P2_Physics_Relighting_v2/_framework_smoke

path_resolution:
  enabled: true
  known_project_roots:
    - /mnt/e/projects/face2
    - E:/projects/face2
    - E:\projects\face2
  require_exists: true
  rewrite_manifest: false

input_mode: relight_mix
original_probability: 0.5
relighted_probability: 0.5
relighting_sampling: uniform
color_jitter_enabled: false
relighting_enabled: true
consistency_enabled: false

model:
  architecture: resnet18
  pretrained: imagenet
  num_classes: 2
  feature_dim: 512

training:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 16
  max_epochs: 50
  early_stopping_patience: 10
  checkpoint_metric: macro_auc
  seed: 2026
  amp: false

data:
  image_size: 224
  original_rgb_source: p0_e0b_meanbg_224
  original_rgb_override_dir: data/processed/P0_Physics_Audit_v1/images/e0b_meanbg_224
  horizontal_flip_probability: 0.5
  normalization: p1_rgb_official
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
  num_workers: 0

evaluation:
  save_validation_features: true
  evaluate_all_relighting_presets: true

smoke:
  max_epochs: 1
  train_cases: 32
  val_cases: 12

bootstrap:
  iterations: 2000
  seed: 2026
  confidence_interval: percentile_95

gate:
  comparison:
    candidate: p2_a2_relighting
    reference: p2_a1_colorjitter
  performance_tolerance:
    macro_auc_max_drop: 0.01
    macro_f1_max_drop: 0.02
    balanced_accuracy_max_drop: 0.02
    sensitivity_max_drop: 0.03
    specificity_max_drop: 0.03
  positive_signals:
    any_classification_metric_improved: true
    any_stability_metric_improved: true
  stability_metrics:
    prediction_std_lower_is_better: true
    case_flip_rate_lower_is_better: true
    worst_light_auc_higher_is_better: true
  require_no_performance_collapse: true
