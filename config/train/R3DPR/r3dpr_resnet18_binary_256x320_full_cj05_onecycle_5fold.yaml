experiment:
  name: R3DPR_ResNet18_ControlVsPatient_Binary_256x320_Full_CJ05_OneCycle50_5fold
  output_dir: experiments/500Data/R3DPR_ResNet18_ControlVsPatient_Binary_256x320_Full_CJ05_OneCycle50_5fold

task:
  type: binary_control_vs_patient
  num_classes: 2
  negative_class: control
  positive_class: patient

data:
  table_csv: data/processed/global_face_R3DPR/nyha_2class_sex_stratified_group_5fold.csv
  image_root: data/processed/global_face_R3DPR/SH093/images
  image_filename_template: "{ID}.png"
  id_column: ID
  group_id_column: patient_group_id
  fold_column: fold
  label_column: binary_label
  sex_column: SEX
  n_folds: 5
  source_image_height: 320
  source_image_width: 256
  image_height: 320
  image_width: 256

model:
  backbone: resnet18
  pretrained: imagenet
  num_classes: 2
  trainability_strategy: full_finetune

train:
  batch_size: 16
  max_epochs: 50
  epochs: 50
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.0001
  loss: weighted_cross_entropy
  lr_scheduler: onecycle
  onecycle_max_lr: 0.0001
  onecycle_div_factor: 10.0
  onecycle_final_div_factor: 100.0
  onecycle_pct_start: 0.3
  onecycle_anneal_strategy: cos
  onecycle_cycle_momentum: false
  monitor_metric: macro_auc
  random_seed: 2026
  num_workers: 0
  pin_memory: true

augmentation:
  horizontal_flip: true
  brightness: 0.05
  contrast: 0.05

normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
