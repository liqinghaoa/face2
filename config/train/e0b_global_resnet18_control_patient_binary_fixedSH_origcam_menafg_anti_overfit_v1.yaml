experiment:
  name: E0B_Global_ResNet18_ControlVsPatient_Binary_fixedSH_origcam_menafg_anti_overfit_v1
  output_dir: experiments/500Data

task:
  type: binary_control_vs_patient
  num_classes: 2
  negative_class: control
  positive_class: patient

data:
  split_dir: data/processed/splits_500
  image_root: data/processed/global_face/fixedSH_origcam_menafg
  image_filename_template: "{ID}.png"
  n_folds: 5
  image_size: 224
  train_csv_pattern: fold_{fold}_train.csv
  val_csv_pattern: fold_{fold}_val.csv

model:
  backbone: resnet18
  pretrained: imagenet
  num_classes: 2
  freeze_backbone: false
  trainability_strategy: partial_layer4
  dropout: 0.5

train:
  batch_size: 16
  epochs: 30
  optimizer: AdamW
  lr: 0.0001
  classifier_lr: 0.0001
  layer4_lr: 0.00001
  weight_decay: 0.001
  loss: weighted_cross_entropy
  early_stopping_patience: 5
  monitor_metric: macro_auc
  random_seed: 2026
  num_workers: 0
  pin_memory: false
  use_amp: false
  gradient_clip_max_norm: 1.0

augmentation:
  horizontal_flip: true

normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
