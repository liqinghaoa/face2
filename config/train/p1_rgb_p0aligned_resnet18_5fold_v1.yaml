experiment:
  name: P1_RGB_P0Aligned_ResNet18_5fold_v1
task: {type: binary_control_vs_patient, num_classes: 2}
data:
  master_manifest: data/processed/P1_Component_Audit_v1/manifests/p1_master_manifest.csv
  fixed_split: data/processed/P0_Physics_Audit_v1/splits_500/nyha_3class_sex_stratified_group_5fold.csv
  image_size: 224
model: {backbone: resnet18, pretrained: imagenet1k_v1, num_classes: 2, full_finetune: true}
optimizer: {name: AdamW, learning_rate: 1.0e-4, weight_decay: 1.0e-4}
training: {batch_size: 16, max_epochs: 50, early_stopping_patience: 10, model_selection_metric: macro_auc, model_selection_mode: max, amp: false, seed: 2026}
dataloader: {num_workers: 0, pin_memory: false, persistent_workers: false}
normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
